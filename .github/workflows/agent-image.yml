name: Build and publish agent image

on:
  push:
    branches: [main]
    paths:
      - 'agent-image/**'
      - '.github/workflows/agent-image.yml'
  workflow_dispatch:
  schedule:
    # Weekly rebuild picks up new claude-code/codex/cc-connect releases.
    - cron: '0 4 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/agentquarters-agent:latest agent-image/

      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/agentquarters-agent:latest
