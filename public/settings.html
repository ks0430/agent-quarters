<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — AgentDeploy</title>
<link rel="stylesheet" href="style.css">
<style>
  .stats { display: flex; gap: 14px; flex-wrap: wrap; margin: 14px 0; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px; }
  .stat .v { font-size: 22px; font-weight: 700; }
  .stat .k { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .dead { opacity: .45; }
  .num { text-align: right; }
  section.page { max-width: 860px; margin: 24px auto; padding: 0 24px; }
  .card + .card { margin-top: 18px; }
</style>
</head>
<body>
<header><div class="brand">⚡ AgentDeploy — settings</div><a class="btn ghost" href="/">← Dashboard</a></header>
<section class="page" id="content">
  <div class="card">
    <h3 style="margin-top:0">Account</h3>
    <p class="muted">Signed in as <strong id="acct-email">…</strong></p>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Billing</h3>
    <div class="stats" id="bill-stats"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center" id="bill-actions">
      <span class="muted">Add credits:</span>
      <span id="topup-buttons"></span>
      <span style="flex:1"></span>
      <span id="plan-box"></span>
    </div>
    <div class="err" id="bill-error"></div>
    <h4 style="margin-bottom:4px">Recent transactions</h4>
    <table id="ledger"></table>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Server usage &amp; costs</h3>
    <p class="muted">Your servers are billed at our AWS cost — no markup. Estimates mirror
       AWS Lightsail hourly billing, capped at the server's monthly price.</p>
    <div class="stats" id="stats"></div>
    <table id="servers"></table>
  </div>
</section>
<script>
const $ = (id) => document.getElementById(id);
const money = (n) => '$' + n.toFixed(2);
const fmtDate = (s) => s ? s.slice(0, 16) + ' UTC' : '';

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}

async function loadBilling() {
  const b = await fetch('/api/billing').then((r) => r.json());
  const daysLeft = b.burnCentsDay > 0 ? (b.balanceCents / b.burnCentsDay).toFixed(1) : '∞';
  $('bill-stats').innerHTML = [
    ['Credit balance', money(b.balanceCents / 100)],
    ['Burn rate', money(b.burnCentsDay / 100) + '/day'],
    ['Runway', daysLeft + ' days'],
    ['Plan', b.plan === 'multi' ? 'Multi (5 servers)' : 'Free (1 server)'],
  ].map(([k, v]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');

  $('topup-buttons').innerHTML = b.topupAmounts.map((a) =>
    `<button class="btn" data-topup="${a}">$${a}</button>`).join(' ');
  document.querySelectorAll('[data-topup]').forEach((btn) => {
    btn.onclick = async () => {
      try { location.href = (await post('/api/billing/topup', { amount: +btn.dataset.topup })).url; }
      catch (e) { $('bill-error').textContent = e.message; }
    };
  });

  $('plan-box').innerHTML = b.plan === 'multi'
    ? '<button class="btn" id="manage-btn">Manage subscription</button>'
    : '<button class="btn primary" id="sub-btn">Upgrade to Multi — $9/mo, up to 5 servers</button>';
  const sub = $('sub-btn'); const manage = $('manage-btn');
  if (sub) sub.onclick = async () => {
    try { location.href = (await post('/api/billing/subscribe')).url; }
    catch (e) { $('bill-error').textContent = e.message; }
  };
  if (manage) manage.onclick = async () => {
    try { location.href = (await post('/api/billing/portal')).url; }
    catch (e) { $('bill-error').textContent = e.message; }
  };

  $('ledger').innerHTML = '<tr><th>Date (UTC)</th><th>Change</th><th class="num">Balance after</th><th>Reason</th></tr>' +
    (b.ledger.length ? b.ledger.map((l) => `<tr>
      <td>${l.created_at.slice(0, 16)}</td>
      <td style="color:${l.delta_cents >= 0 ? 'var(--green)' : 'var(--muted)'}">${l.delta_cents >= 0 ? '+' : ''}${money(l.delta_cents / 100)}</td>
      <td class="num">${money(l.balance_after / 100)}</td><td>${l.reason}</td></tr>`).join('')
    : '<tr><td colspan="4" class="muted">No transactions yet — add credits to get started.</td></tr>');
}

(async () => {
  const me = await fetch('/api/me').then((r) => r.json());
  if (!me.email) { location.href = '/'; return; }
  $('acct-email').textContent = me.email;
  loadBilling().catch(() => {});

  const d = await fetch('/api/usage').then((r) => r.json());
  $('stats').innerHTML = [
    ['Active servers', d.summary.activeInstances],
    ['Monthly server cost', money(d.summary.monthlyRunRate)],
    ['This month so far', money(d.summary.costThisMonth)],
    ['All-time', money(d.summary.costAllTime)],
  ].map(([k, v]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');

  $('servers').innerHTML = '<tr><th>Server</th><th>Region</th><th class="num">Agents</th><th>Created</th><th class="num">Hours</th><th class="num">This month</th><th class="num">All-time</th><th>Status</th></tr>' +
    (d.instances.length ? d.instances.map((i) => `
      <tr class="${i.running ? '' : 'dead'}">
        <td>${i.name}</td><td>${i.region}</td><td class="num">${i.agents}</td>
        <td>${fmtDate(i.created_at)}</td><td class="num">${i.hoursTotal}</td>
        <td class="num">${money(i.costThisMonth)}</td><td class="num">${money(i.costTotal)}</td>
        <td>${i.running ? i.state : 'deleted'}</td>
      </tr>`).join('')
    : '<tr><td colspan="8" class="muted">No servers yet.</td></tr>');
})();
</script>
</body>
</html>
